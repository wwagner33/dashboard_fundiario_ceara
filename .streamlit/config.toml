[server]
# O dashboard não recebe upload de arquivos.
maxUploadSize = 1 #em MB
# Mantido acima do padrão de 200 MB por causa dos mapas maiores.
maxMessageSize = 300 #em MB
enableCORS = false
headless = true
# XSRF só protege upload de arquivos, que o app não usa. Reativar exige testar
# atrás do proxy de produção, porque o Streamlit o desliga quando enableCORS=false.
enableXsrfProtection = false
# Valores de desenvolvimento. Na imagem Docker, STREAMLIT_SERVER_RUN_ON_SAVE=false
# e STREAMLIT_SERVER_FILE_WATCHER_TYPE=none sobrescrevem estes dois.
runOnSave = true
fileWatcherType = "auto"
enableWebsocketCompression = false
baseUrlPath = "paineis"

[client]
toolbarMode = "viewer"
showSidebarNavigation = false


[browser]
gatherUsageStats = false
# serverAddress = "terrace.virtual.ufc.br"


[runner]
magicEnabled = true


[logger]
level = "error"


[theme]
base                     = "light"
primaryColor             = "#008241"
backgroundColor          = "#FFFFFF"
secondaryBackgroundColor = "#FAF5F0"
textColor                = "#000000"
font                     = "Maitree"

[[theme.fontFaces]]
font = "Maitree"
url = "https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Maitree:wght@200;300;400;500;600;700&display=swap&family=Raleway:ital,wght@0,100..900;1,100..900&display=swap"
weight = 500
style = "normal"


