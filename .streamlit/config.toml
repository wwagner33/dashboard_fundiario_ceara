[server]
maxUploadSize = 200
maxMessageSize = 200
enableCORS = false
headless = true
enableXsrfProtection = false
runOnSave = true
# address = "0.0.0.0"
# port = 8501
fileWatcherType = "auto"
enableWebsocketCompression = false
baseUrlPath = "paineis"

[browser]
gatherUsageStats = false
# serverAddress = "terrace.virtual.ufc.br"


[runner]
magicEnabled = true

[logger]
level = "error"


[theme]
base                     = "light"
primaryColor             = "#00a84a"
backgroundColor          = "#FFFFFF"
secondaryBackgroundColor = "#FAF5F0"
textColor                = "#000000"
font                     = "sans serif"

